name: update

on:
  schedule:
    - cron: '0 23 * * *'   # 23:00 UTC = 08:00 KST
    - cron: '0 11 * * *'   # 11:00 UTC = 20:00 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-calendar-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect data
        run: python scripts/collect_data.py
      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar_data.js
          if git diff --cached --quiet; then
            echo "No changes — skipping commit"
          else
            git commit -m "chore: update calendar data ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi
