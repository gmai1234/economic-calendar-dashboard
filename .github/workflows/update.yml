name: update

on:
  schedule:
    - cron: '0 23 * * *'   # 08:00 KST
    - cron: '0 11 * * *'   # 20:00 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-calendar-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Probe BLS reachability (debug)
        run: |
          echo "=== curl -I test ==="
          curl -sI -A "Mozilla/5.0 (compatible; economic-calendar-dashboard/1.0)" https://www.bls.gov/schedule/news_release/bls.ics || true
          echo ""
          echo "=== python urllib test ==="
          python3 -c "
          import urllib.request
          req = urllib.request.Request('https://www.bls.gov/schedule/news_release/bls.ics', headers={'User-Agent': 'Mozilla/5.0 (compatible; economic-calendar-dashboard/1.0)'})
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = r.read()
                  print(f'HTTP {r.getcode()}, {len(data)} bytes, first 100 chars: {data[:100]}')
          except Exception as e:
              import traceback
              print(f'Failed: {type(e).__name__}: {e}')
              traceback.print_exc()
          "
        continue-on-error: true

      - name: Collect data + save log
        run: |
          set +e
          python scripts/collect_data.py 2>&1 | tee debug_log.txt
          echo "" >> debug_log.txt
          echo "=== exit_code=$? ===" >> debug_log.txt
          echo "=== utc_time=$(date -u '+%Y-%m-%dT%H:%M:%SZ') ===" >> debug_log.txt
          set -e

      - name: Commit calendar_data + debug_log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes — skipping commit"
          else
            git commit -m "chore: update calendar data + debug log ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi
